services:
  - type: web
    name: reliabilityx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://reliabilityx.vercel.app,http://localhost:5173,http://localhost:3000
      - key: RELIABILITYX_DB_PATH
        value: reliabilityx.db

