[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reliabilityx"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "openpyxl>=3.1.0",
    "Jinja2>=3.1.0"
]

[tool.setuptools.packages.find]
include = ["backend*", "api*"]
exclude = ["frontend*"]

[tool.vercel]
entrypoint = "backend.main:app"
