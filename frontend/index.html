<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D1B2E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReliabilityX">
  <meta name="application-name" content="ReliabilityX">
  <meta name="description" content="AI-Driven Anomaly Detection in Component Burn-In &amp; Screening — SIH26170">

  <title>ReliabilityX — Predictive Component Reliability Intelligence</title>

  <!-- PWA Manifest (enables "Add to Home Screen" on Android & iOS) -->
  <link rel="manifest" href="/static/manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icon.png">
  <link rel="shortcut icon" href="/static/icon.png">

  <!-- Apple Touch Icon (iPhone/iPad home screen icon) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/static/icon-192.png">

  <!-- MS Tiles (Windows Start) -->
  <meta name="msapplication-TileColor" content="#0D1B2E">
  <meta name="msapplication-TileImage" content="/static/icon-192.png">

  <link rel="stylesheet" href="/static/style.css">

  <!-- Production-Grade React 18 Standalone Libraries -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
</head>
<body>
  <!-- ==========================================================================
       RELIABILITYX FULL-SCREEN INTRO (Cinematic Full-Screen Centered Video)
       ========================================================================== -->
  <div id="rx-intro-overlay" class="intro-screen rx-intro-overlay" aria-hidden="true">
    <video
      id="rx-intro-video"
      class="intro-video rx-intro-video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      x5-playsinline
      preload="auto"
      title="ReliabilityX Introduction Video"
    ></video>
    <button id="rx-sound-btn" class="rx-sound-btn" style="display: none;" aria-label="Enable sound">
      <span class="rx-sound-icon">🔊</span>
      <span class="rx-sound-text">Tap for Sound</span>
    </button>
  </div>

  <!-- React 18 Application Root Mount Target -->
  <div id="root" class="rx-root-container">
    <!-- Initial Loading State before React 18 mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090F1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 32px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px;">
        ⚡ Reliability<span style="color: #38BDF8;">X</span>
      </div>
      <div style="font-size: 14px; color: #94A3B8; margin-bottom: 24px;">
        Predictive Component Reliability Intelligence · SIH26170
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #38BDF8;">
        <span class="status-pulse" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #38BDF8;"></span>
        Initializing React 18 Decision-Support Intelligence Suite...
      </div>
    </div>
  </div>

  <!-- Intro Lifecycle Management Script (Website vs Mobile App Separation with Original Audio) -->
  <script>
  (function() {
    var overlay  = document.getElementById("rx-intro-overlay");
    var video    = document.getElementById("rx-intro-video");
    var soundBtn = document.getElementById("rx-sound-btn");
    var root     = document.getElementById("root");
    var finished = false;

    // Respect prefers-reduced-motion
    var motionQuery = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    if (motionQuery && motionQuery.matches) {
      if (overlay) overlay.style.display = "none";
      if (root) root.classList.add("rx-root-revealed");
      try { window.dispatchEvent(new CustomEvent("rx-intro-complete")); } catch(e){}
      return;
    }

    // -------------------------------------------------------------------------
    // PLATFORM SELECTION:
    // 1. Desktop / Web Browser -> OLD WEBSITE INTRO VIDEO (/static/intro.mp4)
    // 2. Mobile App / Android Phone -> NEW MOBILE APP INTRO VIDEO (/static/mobile-intro.mp4 + AUDIO)
    // -------------------------------------------------------------------------
    function isMobilePlatform() {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("platform") === "mobile" || params.get("mode") === "mobile" || params.get("app") === "mobile") return true;
        if (params.get("platform") === "web" || params.get("mode") === "web" || params.get("platform") === "desktop") return false;
        if (window.location.hash.indexOf("mobile-app") !== -1 || window.location.hash.indexOf("mobile") !== -1) return true;
      } catch(e) {}

      // Android App Wrapper, WebView, PWA Standalone Mode
      var isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
      var isNavStandalone = window.navigator.standalone === true;
      var isAndroidAppReferrer = document.referrer && document.referrer.indexOf("android-app://") !== -1;
      var isWebView = typeof window !== "undefined" && (window.Android || window.ReactNativeWebView || window.Capacitor || window.Cordova);
      if (isStandalone || isNavStandalone || isAndroidAppReferrer || isWebView) return true;

      // Mobile Device & Android User Agent Detection
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS|wv/i.test(ua);

      // Touch screen & portrait phone geometry
      var isSmallTouch = (window.innerWidth <= 820 && window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      var isPortraitMobile = (window.innerWidth <= 768 && window.innerHeight > window.innerWidth);

      return isMobileUA || isSmallTouch || isPortraitMobile;
    }

    var isMobile = isMobilePlatform();
    var videoFile = isMobile ? "/static/mobile-intro.mp4" : "/static/intro.mp4";

    console.log("[ReliabilityX Intro] Platform:", isMobile ? "MOBILE APP" : "WEBSITE", "-> Target Asset:", videoFile);

    if (overlay && isMobile) {
      overlay.classList.add("rx-mobile-intro-overlay");
    }

    function finishIntro() {
      if (finished) return;
      finished = true;

      if (video) {
        try {
          video.pause();
          video.volume = 0;
        } catch(e){}
      }

      if (overlay) {
        overlay.classList.add("rx-intro-fading");
      }

      if (root) {
        root.classList.add("rx-root-revealed");
      }

      setTimeout(function() {
        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }
        try {
          window.dispatchEvent(new CustomEvent("rx-intro-complete"));
        } catch(e){}
      }, 600);
    }

    function enableSound(e) {
      if (e) {
        try { e.stopPropagation(); } catch(err){}
      }
      try {
        if (video) {
          video.muted = false;
          video.volume = 1.0;
          video.play().catch(function(){});
        }
      } catch(err){}
      if (soundBtn) {
        soundBtn.style.opacity = "0";
        setTimeout(function() {
          if (soundBtn && soundBtn.parentNode) {
            soundBtn.parentNode.removeChild(soundBtn);
          }
        }, 200);
      }
      document.removeEventListener("touchstart", enableSound);
      document.removeEventListener("touchend", enableSound);
      document.removeEventListener("click", enableSound);
      document.removeEventListener("pointerdown", enableSound);
    }

    if (soundBtn) {
      soundBtn.addEventListener("click", enableSound);
      soundBtn.addEventListener("touchstart", enableSound, { passive: true });
    }

    // Full screen listeners: touching or clicking anywhere enables audio immediately
    document.addEventListener("touchstart", enableSound, { passive: true });
    document.addEventListener("click", enableSound);
    document.addEventListener("pointerdown", enableSound);

    if (video) {
      if (isMobile) {
        video.classList.add("rx-mobile-intro-video");
      }

      // Essential mobile inline video attributes
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("playsinline", "true");
      video.setAttribute("webkit-playsinline", "true");
      video.setAttribute("x5-playsinline", "true");

      // Set clean target source
      video.src = videoFile;

      // Completion triggers
      video.addEventListener("ended", finishIntro);
      video.addEventListener("timeupdate", function() {
        if (video.duration && video.duration > 1.0 && video.currentTime >= video.duration - 0.25) {
          finishIntro();
        }
      });

      // Handle video error without blocking app
      video.addEventListener("error", function(e) {
        console.warn("[ReliabilityX Intro] Video element error:", e);
        finishIntro();
      });

      // Start playback immediately (muted ensures guaranteed autoplay across all browsers)
      var playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise
          .then(function() {
            console.log("[ReliabilityX Intro] Video playback active.");
            if (isMobile) {
              // Attempt to un-mute for Android WebView / allowed environments
              try {
                video.muted = false;
                video.volume = 1.0;
                var unmutedTest = video.play();
                if (unmutedTest !== undefined) {
                  unmutedTest
                    .then(function() {
                      console.log("[ReliabilityX Intro] Unmuted audio allowed by platform.");
                      if (soundBtn && soundBtn.parentNode) {
                        soundBtn.parentNode.removeChild(soundBtn);
                      }
                    })
                    .catch(function() {
                      // Browser policy blocked unmuted autoplay: re-mute so video plays smoothly
                      video.muted = true;
                      video.play().catch(function(){});
                      if (soundBtn) {
                        soundBtn.style.display = "inline-flex";
                      }
                    });
                }
              } catch(e) {
                video.muted = true;
                if (soundBtn) soundBtn.style.display = "inline-flex";
              }
            }
          })
          .catch(function(err) {
            console.warn("[ReliabilityX Intro] Autoplay error, retrying muted:", err);
            video.muted = true;
            video.play().catch(function(e) {
              console.error("[ReliabilityX Intro] Video play error:", e);
              finishIntro();
            });
            if (isMobile && soundBtn) {
              soundBtn.style.display = "inline-flex";
            }
          });
      }

      // Start loading video
      video.load();
    } else {
      finishIntro();
    }

    // Safety fallback: maximum 10 seconds under any circumstance
    setTimeout(function() {
      if (!finished) {
        finishIntro();
      }
    }, 10000);
  })();
  </script>

  <!-- Interactive React 18 Application Bundle (Compiled from app.tsx) -->
  <script src="/static/app.bundle.js"></script>
</body>
</html>
