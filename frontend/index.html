<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D1B2E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReliabilityX">
  <meta name="application-name" content="ReliabilityX">
  <meta name="description" content="AI-Driven Anomaly Detection in Component Burn-In &amp; Screening — SIH26170">

  <title>ReliabilityX — Predictive Component Reliability Intelligence</title>

  <!-- PWA Manifest (enables "Add to Home Screen" on Android & iOS) -->
  <link rel="manifest" href="/static/manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icon.png">
  <link rel="shortcut icon" href="/static/icon.png">

  <!-- Apple Touch Icon (iPhone/iPad home screen icon) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/static/icon-192.png">

  <!-- MS Tiles (Windows Start) -->
  <meta name="msapplication-TileColor" content="#0D1B2E">
  <meta name="msapplication-TileImage" content="/static/icon-192.png">

  <link rel="stylesheet" href="/static/style.css">

  <!-- Production-Grade React 18 Standalone Libraries -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
</head>
<body>
  <!-- ==========================================================================
       RELIABILITYX FULL-SCREEN INTRO (Cinematic Full-Screen Centered Video)
       ========================================================================== -->
  <div id="rx-intro-overlay" class="intro-screen rx-intro-overlay" aria-hidden="true">
    <video
      id="rx-intro-video"
      class="intro-video rx-intro-video"
      src="/static/intro.mp4"
      autoplay
      playsinline
      preload="auto"
      title="ReliabilityX Introduction Video"
    >
      <source src="/static/intro.mp4" type="video/mp4">
      <source src="/static/intro.mov" type="video/quicktime">
    </video>
  </div>

  <!-- React 18 Application Root Mount Target -->
  <div id="root" class="rx-root-container">
    <!-- Initial Loading State before React 18 mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090F1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 32px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px;">
        ⚡ Reliability<span style="color: #38BDF8;">X</span>
      </div>
      <div style="font-size: 14px; color: #94A3B8; margin-bottom: 24px;">
        Predictive Component Reliability Intelligence · SIH26170
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #38BDF8;">
        <span class="status-pulse" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #38BDF8;"></span>
        Initializing React 18 Decision-Support Intelligence Suite...
      </div>
    </div>
  </div>

  <!-- Intro Lifecycle Management Script (Website vs Mobile App Separation with Original Audio) -->
  <script>
  (function() {
    var overlay = document.getElementById("rx-intro-overlay");
    var video   = document.getElementById("rx-intro-video");
    var finished = false;

    // Respect prefers-reduced-motion
    var motionQuery = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    if (motionQuery && motionQuery.matches) {
      if (overlay) overlay.style.display = "none";
      if (video) { try { video.pause(); video.src = ""; } catch(e){} }
      return;
    }

    // -------------------------------------------------------------------------
    // PLATFORM SELECTION:
    // 1. Desktop / Web Browser -> OLD WEBSITE INTRO VIDEO (/static/intro.mp4)
    // 2. Mobile App / Android Phone -> NEW MOBILE APP INTRO VIDEO (/static/mobile-intro.mp4 + AUDIO)
    // -------------------------------------------------------------------------
    function isMobilePlatform() {
      // 1. Allow explicit URL override for testing (?platform=mobile or ?platform=web)
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("platform") === "mobile" || params.get("mode") === "mobile" || params.get("app") === "mobile") return true;
        if (params.get("platform") === "web" || params.get("mode") === "web" || params.get("platform") === "desktop") return false;
        if (window.location.hash.indexOf("mobile-app") !== -1) return true;
      } catch(e) {}

      // 2. Android App Wrapper / PWA Standalone Mode
      var isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
      var isNavStandalone = window.navigator.standalone === true;
      var isAndroidAppReferrer = document.referrer && document.referrer.indexOf("android-app://") !== -1;
      if (isStandalone || isNavStandalone || isAndroidAppReferrer) return true;

      // 3. Mobile Device & Android User Agent Detection
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(ua);

      // 4. Touch screen & portrait phone geometry
      var isSmallTouch = (window.innerWidth <= 820 && window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      var isPortraitMobile = (window.innerWidth <= 768 && window.innerHeight > window.innerWidth);

      return isMobileUA || isSmallTouch || isPortraitMobile;
    }

    var isMobile = isMobilePlatform();

    if (isMobile) {
      console.log("[ReliabilityX Intro] Platform: MOBILE APP -> Serving new mobile intro animation (/static/mobile-intro.mp4) with embedded audio.");
      if (overlay) {
        overlay.classList.add("rx-mobile-intro-overlay");
      }
      if (video) {
        video.classList.add("rx-mobile-intro-video");
        video.src = "/static/mobile-intro.mp4";
        while (video.firstChild) {
          video.removeChild(video.firstChild);
        }
        var sourceMobile = document.createElement("source");
        sourceMobile.src = "/static/mobile-intro.mp4";
        sourceMobile.type = "video/mp4";
        video.appendChild(sourceMobile);
        video.load();
      }
    } else {
      console.log("[ReliabilityX Intro] Platform: WEBSITE -> Preserving original desktop website intro animation (/static/intro.mp4).");
      // Desktop website strictly uses original video: /static/intro.mp4
    }

    function finishIntro() {
      if (finished) return;
      finished = true;

      // Stop video and audio immediately
      if (video) {
        try {
          video.pause();
          video.volume = 0;
        } catch(e){}
      }

      // Smooth 600ms fade out, then remove overlay from DOM
      if (overlay) {
        overlay.classList.add("rx-intro-fading");
        setTimeout(function() {
          if (overlay && overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
          try {
            window.dispatchEvent(new CustomEvent("rx-intro-complete"));
          } catch(e){}
        }, 600);
      }
    }

    if (video) {
      // Step 8: Use actual video completion event
      video.addEventListener("ended", finishIntro);

      // Handle near-end transition cleanly
      video.addEventListener("timeupdate", function() {
        if (video.duration && video.currentTime >= video.duration - 0.25) {
          finishIntro();
        }
      });

      // If video errors out, do not block app — remove overlay
      video.addEventListener("error", function(e) {
        console.warn("[ReliabilityX Intro] Video element error:", e);
        finishIntro();
      });

      // Preserve original embedded audio track — unmuted at full volume
      video.muted = false;
      video.volume = 1.0;

      // Attempt playback with synchronized original audio
      var playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise
          .then(function() {
            console.log("[ReliabilityX Intro] Video and synchronized original audio playing smoothly.");
          })
          .catch(function(error) {
            console.warn("[ReliabilityX Intro] Audio restricted by platform policy; playing animation smoothly:", error);
            // Audio permission must NEVER stop the animation video or mobile app from loading!
            video.muted = true;
            video.play().catch(function(err) {
              console.warn("[ReliabilityX Intro] Playback failed:", err);
              finishIntro();
            });
          });
      }
    }

    // Safety fallback: ensure overlay is removed after 11 seconds under any circumstance
    setTimeout(function() {
      if (!finished) {
        finishIntro();
      }
    }, 11000);
  })();
  </script>

  <!-- Interactive React 18 Application Bundle (Compiled from app.tsx) -->
  <script src="/static/app.bundle.js"></script>
</body>
</html>
