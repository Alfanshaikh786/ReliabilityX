<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D1B2E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReliabilityX">
  <meta name="application-name" content="ReliabilityX">
  <meta name="description" content="AI-Driven Anomaly Detection in Component Burn-In &amp; Screening — SIH26170">

  <title>ReliabilityX — Predictive Component Reliability Intelligence</title>

  <!-- PWA Manifest (enables "Add to Home Screen" on Android & iOS) -->
  <link rel="manifest" href="/static/manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icon.png">
  <link rel="shortcut icon" href="/static/icon.png">

  <!-- Apple Touch Icon (iPhone/iPad home screen icon) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/static/icon-192.png">

  <!-- MS Tiles (Windows Start) -->
  <meta name="msapplication-TileColor" content="#0D1B2E">
  <meta name="msapplication-TileImage" content="/static/icon-192.png">

  <link rel="stylesheet" href="/static/style.css">

  <!-- Production-Grade React 18 Standalone Libraries -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
</head>
<body>
  <!-- ==========================================================================
       RELIABILITYX FULL-SCREEN INTRO (Cinematic Full-Screen Centered Video)
       ========================================================================== -->
  <div id="rx-intro-overlay" class="intro-screen rx-intro-overlay" aria-hidden="true">
    <!-- Desktop Website Intro Video (Desktop browsers: direct video + audio playback) -->
    <video
      id="rx-website-video"
      class="intro-video rx-intro-video rx-website-video"
      src="/static/intro.mp4"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      title="ReliabilityX Introduction Video"
    ></video>

    <!-- Mobile App Intro Animation (100% Guaranteed Direct Autoplay with ZERO Play Buttons on ALL iPhones / iOS / Android) -->
    <img
      id="rx-mobile-anim"
      class="intro-video rx-intro-video rx-mobile-video rx-mobile-intro-video"
      src="/static/mobile-intro.webp"
      alt="ReliabilityX Mobile Introduction"
    />
    <audio
      id="rx-mobile-audio"
      src="/static/mobile-intro.mp4"
      preload="auto"
    ></audio>
  </div>

  <!-- React 18 Application Root Mount Target -->
  <div id="root" class="rx-root-container">
    <!-- Initial Loading State before React 18 mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090F1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 32px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px;">
        ⚡ Reliability<span style="color: #38BDF8;">X</span>
      </div>
      <div style="font-size: 14px; color: #94A3B8; margin-bottom: 24px;">
        Predictive Component Reliability Intelligence · SIH26170
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #38BDF8;">
        <span class="status-pulse" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #38BDF8;"></span>
        Initializing React 18 Decision-Support Intelligence Suite...
      </div>
    </div>
  </div>

  <!-- Intro Lifecycle Management Script (Website vs Mobile App Separation with Original Audio) -->
  <script>
  (function() {
    var overlay      = document.getElementById("rx-intro-overlay");
    var websiteVideo = document.getElementById("rx-website-video");
    var mobileAnim   = document.getElementById("rx-mobile-anim");
    var mobileAudio  = document.getElementById("rx-mobile-audio");
    var root         = document.getElementById("root");
    var finished     = false;

    // -------------------------------------------------------------------------
    // PLATFORM SELECTION:
    // 1. Desktop / Web Browser -> OLD WEBSITE INTRO VIDEO (/static/intro.mp4)
    // 2. Mobile App / Phone   -> NEW MOBILE APP INTRO ANIMATION (/static/mobile-intro.webp + AUDIO)
    // -------------------------------------------------------------------------
    function isMobilePlatform() {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("platform") === "mobile" || params.get("mode") === "mobile" || params.get("app") === "mobile") return true;
        if (params.get("platform") === "web" || params.get("mode") === "web" || params.get("platform") === "desktop") return false;
        if (window.location.hash.indexOf("mobile-app") !== -1 || window.location.hash.indexOf("mobile") !== -1) return true;
      } catch(e) {}

      // Android App Wrapper, WebView, PWA Standalone Mode
      var isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
      var isNavStandalone = window.navigator.standalone === true;
      var isAndroidAppReferrer = document.referrer && document.referrer.indexOf("android-app://") !== -1;
      var isWebView = typeof window !== "undefined" && (window.Android || window.ReactNativeWebView || window.Capacitor || window.Cordova);
      if (isStandalone || isNavStandalone || isAndroidAppReferrer || isWebView) return true;

      // Mobile Device & Android / iOS User Agent Detection
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS|wv/i.test(ua);

      // Touch screen & portrait phone geometry
      var isSmallTouch = (window.innerWidth <= 820 && window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      var isPortraitMobile = (window.innerWidth <= 768 && window.innerHeight > window.innerWidth);

      return isMobileUA || isSmallTouch || isPortraitMobile;
    }

    var isMobile = isMobilePlatform();

    console.log("[ReliabilityX Intro] Platform:", isMobile ? "MOBILE APP" : "WEBSITE");

    function finishIntro() {
      if (finished) return;
      finished = true;

      if (websiteVideo) {
        try {
          websiteVideo.pause();
          websiteVideo.volume = 0;
        } catch(e){}
      }
      if (mobileAudio) {
        try {
          mobileAudio.pause();
          mobileAudio.volume = 0;
        } catch(e){}
      }

      if (overlay) {
        overlay.classList.add("rx-intro-fading");
      }

      if (root) {
        root.classList.add("rx-root-revealed");
      }

      setTimeout(function() {
        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }
        try {
          window.dispatchEvent(new CustomEvent("rx-intro-complete"));
        } catch(e){}
      }, 600);
    }

    if (isMobile) {
      // -----------------------------------------------------------------------
      // MOBILE APP INTRO
      // Uses animated WebP + audio. Guaranteed 100% direct autoplay with ZERO
      // play buttons on all iPhones / iPads / Android devices regardless of Low Power Mode.
      // -----------------------------------------------------------------------
      if (websiteVideo && websiteVideo.parentNode) {
        try {
          websiteVideo.pause();
          websiteVideo.src = "";
          websiteVideo.parentNode.removeChild(websiteVideo);
        } catch(e){}
      }

      if (overlay) {
        overlay.classList.add("rx-mobile-intro-overlay");
      }

      // Audio handling
      if (mobileAudio) {
        mobileAudio.muted = false;
        mobileAudio.volume = 1.0;
        var audioPromise = mobileAudio.play();
        if (audioPromise !== undefined) {
          audioPromise.catch(function(e) {
            // Unlock audio on first screen touch/tap without interrupting animation
            function unlockAudio() {
              try {
                mobileAudio.muted = false;
                mobileAudio.volume = 1.0;
                mobileAudio.play().catch(function(){});
              } catch(err){}
              window.removeEventListener("touchstart", unlockAudio);
              window.removeEventListener("touchend", unlockAudio);
              window.removeEventListener("click", unlockAudio);
              window.removeEventListener("pointerdown", unlockAudio);
            }
            window.addEventListener("touchstart", unlockAudio, { passive: true });
            window.addEventListener("touchend", unlockAudio, { passive: true });
            window.addEventListener("click", unlockAudio);
            window.addEventListener("pointerdown", unlockAudio);
          });
        }
      }

      // Full mobile animation duration: exactly 10.0 seconds
      setTimeout(function() {
        finishIntro();
      }, 10000);

    } else {
      // -----------------------------------------------------------------------
      // WEBSITE (DESKTOP) INTRO
      // Original desktop video (/static/intro.mp4) with direct audio + video.
      // -----------------------------------------------------------------------
      if (mobileAnim && mobileAnim.parentNode) {
        mobileAnim.parentNode.removeChild(mobileAnim);
      }
      if (mobileAudio && mobileAudio.parentNode) {
        mobileAudio.parentNode.removeChild(mobileAudio);
      }

      if (websiteVideo) {
        websiteVideo.addEventListener("ended", finishIntro);
        websiteVideo.addEventListener("timeupdate", function() {
          if (websiteVideo.duration && websiteVideo.duration > 2.0 && websiteVideo.currentTime >= (websiteVideo.duration - 0.15)) {
            finishIntro();
          }
        });
        websiteVideo.addEventListener("error", function() {
          finishIntro();
        });

        websiteVideo.muted = false;
        websiteVideo.volume = 1.0;
        var p = websiteVideo.play();
        if (p !== undefined) {
          p.catch(function(err) {
            console.warn("[ReliabilityX Intro] Desktop unmuted blocked, falling back to muted:", err);
            websiteVideo.muted = true;
            websiteVideo.play().catch(function(){});
          });
        }

        // Safety timeout for desktop
        websiteVideo.addEventListener("playing", function() {
          var dur = (websiteVideo.duration && websiteVideo.duration > 5) ? websiteVideo.duration : 10.0;
          setTimeout(function() {
            if (!finished) finishIntro();
          }, Math.ceil((dur + 3.5) * 1000));
        }, { once: true });
      } else {
        finishIntro();
      }

      setTimeout(function() {
        if (!finished) finishIntro();
      }, 25000);
    }
  })();
  </script>

  <!-- Interactive React 18 Application Bundle (Compiled from app.tsx) -->
  <script src="/static/app.bundle.js"></script>
</body>
</html>
