  <style>
    /* Immediate WebKit Media Controls suppression to prevent iOS Safari play button flash */
    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-overlay-play-button {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Floating Modern Sound Capsule (Audio Pipeline Affordance) */
    .rx-sound-capsule {
      position: fixed;
      top: max(env(safe-area-inset-top, 20px), 20px);
      right: max(env(safe-area-inset-right, 20px), 20px);
      z-index: 2147483647;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px 9px 12px;
      border-radius: 9999px;
      background: rgba(13, 27, 46, 0.82);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 16px rgba(56, 189, 248, 0.22);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
      pointer-events: auto;
    }

    .rx-sound-capsule.rx-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: rxPulseGlow 2.2s infinite ease-in-out;
    }

    .rx-sound-capsule.rx-audio-active {
      border-color: rgba(52, 211, 153, 0.5);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 16px rgba(52, 211, 153, 0.3);
      color: #34D399;
      animation: none;
    }

    .rx-sound-capsule.rx-fading-out {
      opacity: 0;
      transform: translateY(-6px) scale(0.92);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .rx-sound-icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      position: relative;
    }

    .rx-sound-svg {
      width: 18px;
      height: 18px;
      color: #38BDF8;
      display: block;
    }

    .rx-sound-equalizer {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      width: 14px;
    }

    .rx-sound-capsule.rx-audio-active .rx-sound-svg {
      display: none;
    }

    .rx-sound-capsule.rx-audio-active .rx-sound-equalizer {
      display: flex;
    }

    .rx-eq-bar {
      width: 3px;
      background: #34D399;
      border-radius: 2px;
      animation: rxEqBounce 0.75s ease-in-out infinite alternate;
    }

    .rx-eq-1 { height: 6px; animation-delay: 0.1s; }
    .rx-eq-2 { height: 14px; animation-delay: 0.3s; }
    .rx-eq-3 { height: 9px; animation-delay: 0.2s; }

    @keyframes rxEqBounce {
      0% { height: 4px; }
      50% { height: 14px; }
      100% { height: 6px; }
    }

    @keyframes rxPulseGlow {
      0%, 100% {
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 14px rgba(56, 189, 248, 0.2);
      }
      50% {
        box-shadow: 0 4px 22px rgba(0, 0, 0, 0.5), 0 0 22px rgba(56, 189, 248, 0.5);
      }
    }
  </style>

<body>

  <!-- React 18 Application Root Mount Target -->

    <!-- Initial Loading State before React 18 mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090F1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 32px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px;">
        ⚡ Reliability<span style="color: #38BDF8;">X</span>
      </div>
      <div style="font-size: 14px; color: #94A3B8; margin-bottom: 24px;">
        Predictive Component Reliability Intelligence · SIH26170
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #38BDF8;">
        <span class="status-pulse" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #38BDF8;"></span>
        Initializing React 18 Decision-Support Intelligence Suite...

  <!-- Intro Lifecycle Management Script (Website vs Mobile App Separation with Original Audio) -->
  <script>
  (function() {
    var overlay  = document.getElementById("rx-intro-overlay");
    var video    = document.getElementById("rx-intro-video");
    var capsule  = document.getElementById("rx-sound-capsule");
    var soundTxt = document.getElementById("rx-sound-text");
    var root     = document.getElementById("root");
    var finished = false;

    // -------------------------------------------------------------------------
    // PLATFORM SELECTION:
    // 1. Desktop / Web Browser -> OLD WEBSITE INTRO VIDEO (/static/intro.mp4)
    // 2. Mobile App / Phone   -> NEW MOBILE APP INTRO VIDEO (/static/mobile-intro.mp4)
    // -------------------------------------------------------------------------
    function isMobilePlatform() {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("platform") === "mobile" || params.get("mode") === "mobile" || params.get("app") === "mobile") return true;
        if (params.get("platform") === "web" || params.get("mode") === "web" || params.get("platform") === "desktop") return false;
        if (window.location.hash.indexOf("mobile-app") !== -1 || window.location.hash.indexOf("mobile") !== -1) return true;
      } catch(e) {}

      // Android App Wrapper, WebView, PWA Standalone Mode
      var isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
      var isNavStandalone = window.navigator.standalone === true;
      var isAndroidAppReferrer = document.referrer && document.referrer.indexOf("android-app://") !== -1;
      var isWebView = typeof window !== "undefined" && (window.Android || window.ReactNativeWebView || window.Capacitor || window.Cordova);
      if (isStandalone || isNavStandalone || isAndroidAppReferrer || isWebView) return true;

      // Mobile Device & Android / iOS User Agent Detection
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS|wv/i.test(ua);

      // Touch screen & portrait phone geometry
      var isSmallTouch = (window.innerWidth <= 820 && window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      var isPortraitMobile = (window.innerWidth <= 768 && window.innerHeight > window.innerWidth);

      return isMobileUA || isSmallTouch || isPortraitMobile;
    }

    var isMobile = isMobilePlatform();
    var videoSrc = isMobile ? "/static/mobile-intro.mp4" : "/static/intro.mp4";

    console.log("[ReliabilityX Intro] Platform:", isMobile ? "MOBILE APP" : "WEBSITE", "-> Asset:", videoSrc);

    if (isMobile) {
      if (overlay) overlay.classList.add("rx-mobile-intro-overlay");
      if (video) video.classList.add("rx-mobile-intro-video");
    }

    function finishIntro() {
      if (finished) return;
      finished = true;

      if (video) {
        try {
          video.pause();
          video.volume = 0;
        } catch(e){}
      }

      if (overlay) {
        overlay.classList.add("rx-intro-fading");
      }

      if (root) {
        root.classList.add("rx-root-revealed");
      }

      setTimeout(function() {
        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }
        try {
          window.dispatchEvent(new CustomEvent("rx-intro-complete"));
        } catch(e){}
      }, 600);
    }

    if (video) {
      // Safely ensure playback always starts from frame 0
      function resetToStart() {
        try {
          if (video.currentTime > 0) {
            video.currentTime = 0;
          }
        } catch(e){}
      }

      if (video.readyState >= 1) {
        resetToStart();
      } else {
        video.addEventListener("loadedmetadata", resetToStart, { once: true });
        video.addEventListener("canplay", resetToStart, { once: true });
      }

      // Safety check: ensure selected video asset is active
      var current = video.currentSrc || video.src || "";
      if (current && current.indexOf(isMobile ? "mobile-intro" : "intro.mp4") === -1) {
        video.src = videoSrc;
        video.load();
      }

      // Natural completion triggers — guaranteed to play the FULL video duration:
      video.addEventListener("ended", finishIntro);
      video.addEventListener("timeupdate", function() {
        if (video.duration && video.duration > 2.0 && video.currentTime >= (video.duration - 0.15)) {
          finishIntro();
        }
      });
      video.addEventListener("error", function(err) {
        console.warn("[ReliabilityX Intro] Video load error, transitioning to dashboard:", err);
        finishIntro();
      });

      // -----------------------------------------------------------------------
      // UNIFIED AUDIO PIPELINE (Hardware Audio + Web Audio API Unlocking)
      // -----------------------------------------------------------------------
      var audioCtx = null;
      var audioUnlocked = false;

      function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;

        // 1. Hardware-level unmuting of HTML5 video element
        try {
          if (video) {
            video.muted = false;
            video.defaultMuted = false;
            video.removeAttribute("muted");
            video.volume = 1.0;
          }
        } catch(e){}

        // 2. Initialize / Resume Web Audio Context
        try {
          var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            if (!audioCtx) audioCtx = new AudioCtxClass();
            if (audioCtx.state === "suspended") {
              audioCtx.resume();
            }
          }
        } catch(e){}

        // 3. Update Audio Capsule to Active State & smoothly fade out
        if (capsule) {
          capsule.classList.remove("rx-visible");
          capsule.classList.add("rx-audio-active");
          if (soundTxt) soundTxt.textContent = "Sound On";
          setTimeout(function() {
            if (capsule) capsule.classList.add("rx-fading-out");
          }, 1800);
        }

        try {
          localStorage.setItem("rx_sound_enabled", "true");
        } catch(e){}
      }

      // Capture-phase global interaction unlock: any tap/touch on screen immediately unmutes
      ['touchstart', 'touchend', 'click', 'pointerdown', 'keydown'].forEach(function(ev) {
        window.addEventListener(ev, unlockAudio, { passive: true, capture: true });
        document.addEventListener(ev, unlockAudio, { passive: true, capture: true });
      });

      if (capsule) {
        capsule.addEventListener("click", function(e) {
          e.stopPropagation();
          unlockAudio();
        });
        capsule.addEventListener("touchstart", function(e) {
          e.stopPropagation();
          unlockAudio();
        }, { passive: true });
      }

      if (isMobile) {
        // MOBILE PLAYBACK ENGINE:
        // Ensure video is playing smoothly
        video.muted = true;
        video.defaultMuted = true;

        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(e) {
            console.warn("[ReliabilityX Intro] Mobile playback initializing:", e);
            video.muted = true;
            video.play().catch(function(){});
          });
        }

        // Test if browser autoplay policy allows unmuted audio immediately (Chrome MEI / PWA)
        try {
          var testAudio = document.createElement("audio");
          testAudio.volume = 0.05;
          testAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
          var tp = testAudio.play();
          if (tp !== undefined) {
            tp.then(function() {
              try { testAudio.pause(); } catch(e){}
              console.log("[ReliabilityX Audio] Browser policy allows unmuted playback!");
              unlockAudio();
            }).catch(function() {
              // Policy requires user gesture; display comfortable sound capsule
              if (capsule) capsule.classList.add("rx-visible");
            });
          } else {
            if (capsule) capsule.classList.add("rx-visible");
          }
        } catch(e) {
          if (capsule) capsule.classList.add("rx-visible");
        }

      } else {
        // WEBSITE (DESKTOP) PLAYBACK:
        // Original direct unmuted audio + video playback
        video.muted = false;
        video.volume = 1.0;
        var p = video.play();
        if (p !== undefined) {
          p.then(function() {
            unlockAudio();
          }).catch(function(err) {
            console.warn("[ReliabilityX Intro] Desktop unmuted blocked, falling back to muted:", err);
            video.muted = true;
            video.play().catch(function(){});
            if (capsule) capsule.classList.add("rx-visible");
          });
        }
      }

      // Anchored safety timeout: starts ONLY after video actually begins playing frames!
      video.addEventListener("playing", function() {
        var dur = (video.duration && video.duration > 5) ? video.duration : 10.0;
        // Wait for full video duration plus 3.5s buffer before safety cutoff
        setTimeout(function() {
          if (!finished) {
            finishIntro();
          }
        }, Math.ceil((dur + 3.5) * 1000));
      }, { once: true });

    } else {
      finishIntro();
    }

    // Absolute fallback in case network drops before video starts (25 seconds)
    setTimeout(function() {
      if (!finished) {
        finishIntro();
      }
    }, 25000);
  })();
  </script>

  <!-- Interactive React 18 Application Bundle (Compiled from app.tsx) -->
  <script src="/static/app.bundle.js?v=2.1.1"></script>
